name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            global.json

      - name: Restore dependencies
        run: dotnet restore TabletMidiPad.Tests/TabletMidiPad.Tests.csproj

      - name: Test
        run: dotnet test TabletMidiPad.Tests/TabletMidiPad.Tests.csproj -c Release --no-restore --verbosity minimal

      - name: Create public publish output
        run: dotnet publish TabletMidiPad.csproj -c Release -r win-x64 --self-contained false -o artifacts/publish -p:DebugType=None -p:DebugSymbols=false --verbosity minimal

      - name: Generate safe uninstall manifest
        shell: pwsh
        run: ./installer/Generate-UninstallManifest.ps1 -PublishDirectory artifacts/publish -OutputPath installer/UninstallFiles.generated.nsh

      - name: Verify public-release policy
        shell: pwsh
        run: ./scripts/Test-PublicRelease.ps1 -PublishDirectory artifacts/publish

      - name: Install NSIS
        run: choco install nsis --version=3.11.0 --no-progress --yes

      - name: Compile installer with warnings as errors
        shell: pwsh
        run: ./installer/Build-Installer.ps1

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
